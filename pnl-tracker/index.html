<!DOCTYPE html>
<html lang="en" class="dark bg-[#030712]" style="background-color: #030712; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Trading Journal</title>

    <!-- Critical instant dark background styling to eliminate startup flash -->
    <style>
      html, body, #root {
        background-color: #030712 !important;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
        min-height: 100%;
        color-scheme: dark;
      }
    </style>

    <!-- PWA Web App Manifest (v=9 cache buster) -->
    <link rel="manifest" href="/manifest.json?v=9">

    <!-- iOS Native App Mode & Standalone Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TradeJournal">

    <!-- Pure SVG App Icon & iOS Touch Icon (v=9 cache buster) -->
    <link rel="icon" type="image/svg+xml" href="/apple-touch-icon.svg?v=9">
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg?v=9">

    <!-- Mobile Theme Capabilities -->
    <meta name="theme-color" content="#030712">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
  </head>
  <body class="bg-[#030712] text-gray-100 antialiased selection:bg-emerald-500/30" style="background-color: #030712;">
    <div id="root" style="background-color: #030712; min-height: 100vh;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
